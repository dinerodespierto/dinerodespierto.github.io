function calcRetiro() {
  const años = Math.max(1, S.retiro - S.edad), r = S.tasa / 100 / 12;
  const fv = (y) => { const g = Math.pow(1 + r, y * 12); return S.inicial * g + S.aporte * (g - 1) / r; };

  const dm = esMes ? cadaMes(t, monto) : null;
  if (dm) { valor = dm.valor; puesto = dm.puesto; n = dm.n; } else { valor = monto * unaVez(t); puesto = monto; }

function grafica(sel) {
  const rt = ruta(sel.a.t);
  if (!rt || sel.a.t === 'USD') return null;
  const W = 310, GH = 150;
  let vals, base = null;
  if (sel.esMes) {
    let u = 0; vals = []; base = [];
    rt.compra.forEach((p, j) => { u += sel.monto / p; vals.push(u * p); base.push(sel.monto * (j + 1)); });
    vals.push(u * rt.actual); base.push(sel.monto * rt.compra.length);
  } else {
    const pts = rt.compra.concat([rt.actual]);
    vals = pts.map((p) => sel.monto * p / pts[0]);
  }
  const todos = base ? vals.concat(base) : vals;
  const lo = Math.min(...todos) * 0.95, hi = Math.max(...todos) * 1.03, n = vals.length;
  const px = (i) => i / (n - 1) * W, py = (v) => 8 + (1 - (v - lo) / (hi - lo)) * (GH - 16);
  const path = (arr) => arr.map((v, i) => (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1)).join(' ');
  const g = { vals, linea: path(vals), base: base ? path(base) : '', n };
  g.area = g.linea + ' L' + W + ' ' + GH + ' L0 ' + GH + ' Z';
  g.finX = px(n - 1); g.finY = py(vals[n - 1]);
  g.mid = mesDe(Math.round((n - 2) / 2));
  if (sel.esMes) {
    let peor = 0, iP = 0;
    vals.forEach((v, i) => { const r = v / base[i] - 1; if (r < peor) { peor = r; iP = i; } });
    g.minX = px(iP); g.minY = py(vals[iP]);
    g.txt = peor < 0 ? 'Su peor momento ' + (iP === n - 1 ? 'es hoy' : 'fue en ' + mesDe(iP)) + ': ibas ' + Math.round(peor * 100) + '% frente a lo que habías puesto. ' + (sel.x >= 1 ? 'Quien siguió aportando, terminó ganando.' : 'Todavía no se recupera.') : 'Nunca estuviste en pérdida frente a lo que habías puesto.';
  } else {
    let pico = vals[0], iPi = 0, dd = 0, iF = 0, iPD = 0;
    vals.forEach((v, i) => { if (v > pico) { pico = v; iPi = i; } const c = v / pico - 1; if (c < dd) { dd = c; iF = i; iPD = iPi; } });
    g.minX = px(iF); g.minY = py(vals[iF]);

  }
  return g;
}

  words.forEach((w) => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line);

function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
async function crearImagen(sel) {
  try { await document.fonts.load('800 60px Montserrat'); await document.fonts.load('700 40px Montserrat'); } catch (e) { /* usar fuente del sistema */ }
  const W = 1080, H = 1920, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d'), F = 'Montserrat, system-ui, sans-serif', P = 96;
  x.fillStyle = '#0d0d0d'; x.fillRect(0, 0, W, H);
  x.fillStyle = GOLD; x.font = '800 38px ' + F; x.fillText('DINERO DESPIERTO', P, 190);
  x.fillStyle = '#e5e5e5'; x.font = '700 60px ' + F;
  const l1 = sel.esMes
    ? 'Si hubiera invertido ' + money(sel.monto) + ' al mes en ' + sel.a.nombre + ' desde septiembre de 2022, hoy tendría'
    : 'Si hubiera invertido ' + money(sel.monto) + ' en ' + sel.a.nombre + ' en septiembre de 2022, hoy tendría';
  let y = 470;
  wrap(x, l1, W - 2 * P).forEach((ln) => { x.fillText(ln, P, y); y += 80; });
  y += 110;
  x.fillStyle = sel.x >= 1 ? GOLD : DOWN; x.font = '800 190px ' + F;
  let vt = money(sel.valor), fs = 190;
  while (x.measureText(vt).width > W - 2 * P && fs > 90) { fs -= 10; x.font = '800 ' + fs + 'px ' + F; }
  x.fillText(vt, P, y);
  y += 70;
  x.font = '800 46px ' + F;
  const pt = pctOf(sel.x), pw = x.measureText(pt).width + 56;
  x.fillStyle = colorOf(sel.x); rrect(x, P, y, pw, 84, 42); x.fill();
  x.fillStyle = '#0d0d0d'; x.fillText(pt, P + 28, y + 58);
  if (sel.esMes) { x.fillStyle = '#a3a3a3'; x.font = '600 40px ' + F; x.fillText('Puse ' + money(sel.puesto) + ' en total', P + pw + 28, y + 56); }
  const g = grafica(sel);
  if (g) {
    const gx = P, gy = 1180, gw = W - 2 * P, gh = 330, n = g.vals.length;
    const lo = Math.min(...g.vals) * 0.95, hi = Math.max(...g.vals) * 1.03;
    const px = (i) => gx + i / (n - 1) * gw, py = (v) => gy + (1 - (v - lo) / (hi - lo)) * gh;
    x.beginPath(); g.vals.forEach((v, i) => (i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))));
    x.lineTo(gx + gw, gy + gh + 20); x.lineTo(gx, gy + gh + 20); x.closePath();
    x.fillStyle = 'rgba(240,192,64,0.12)'; x.fill();
    x.beginPath(); g.vals.forEach((v, i) => (i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))));
    x.strokeStyle = GOLD; x.lineWidth = 7; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke();
    x.fillStyle = '#8f8f8f'; x.font = '600 30px ' + F; x.fillText('sep 2022', gx, gy + gh + 75);
    const hw = x.measureText('hoy').width; x.fillText('hoy', gx + gw - hw, gy + gh + 75);
  }
  x.fillStyle = '#8f8f8f'; x.font = '600 30px ' + F;
  x.fillText('Datos reales al ' + fechaTxt + '. No es asesoría financiera.', P, 1660);
  x.fillStyle = '#2a2a2a'; x.fillRect(P, 1700, W - 2 * P, 2);
  x.fillStyle = '#ffffff'; x.font = '800 54px ' + F; x.fillText('¿Y tú cuánto tendrías?', P, 1790);
  x.fillStyle = GOLD; x.font = '700 42px ' + F; x.fillText('Calcúlalo en @dinero.despierto', P, 1856);
  return new Promise((res) => c.toBlob((b) => res(b), 'image/png'));
}
async function abrirCompartir() {
  const sel = ultimaSel || calcSel();
  capa.innerHTML = '<div class="overlay center" role="dialog" aria-modal="true" aria-label="Compartir resultado"><button class="scrim" data-close aria-label="Cerrar"></button><div class="share-actions"><p>Preparando tu imagen…</p></div></div>';
  const blob = await crearImagen(sel);
  if (!blob) { cerrar(); toast('No se pudo crear la imagen'); return; }
  const url = URL.createObjectURL(blob);
  const nombre = 'dinero-despierto-' + sel.a.t.toLowerCase() + '.png';
  const file = typeof File === 'function' ? new File([blob], nombre, { type: 'image/png' }) : null;
  const puedeCompartir = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
  capa.innerHTML = '<div class="overlay center" role="dialog" aria-modal="true" aria-label="Compartir resultado"><button class="scrim" data-close aria-label="Cerrar"></button>' +
    '<img class="story-img" src="' + url + '" alt="Imagen para historias con tu resultado en ' + esc(sel.a.nombre) + '">' +
    '<div class="share-actions">' +
    (puedeCompartir ? '<button type="button" class="btn sm" id="shNative">Compartir en historias</button>' : '') +
    '<a class="btn ' + (puedeCompartir ? 'ghost ' : '') + 'sm" id="shDown" href="' + url + '" download="' + nombre + '">Descargar imagen</a>' +
    '<button type="button" class="btn ghost sm" id="shLink">Copiar enlace del simulador</button>' +
    '<p>Súbela a tus historias y etiqueta a <strong style="color:var(--gold)">@dinero.despierto</strong>.</p>' +
    '<button type="button" class="btn ghost sm" data-close>Cerrar</button></div></div>';
  const n = $('#shNative');
  if (n) n.addEventListener('click', async () => { try { await navigator.share({ files: [file], title: 'Mi resultado', text: '¿Y tú cuánto tendrías? ' + location.origin + location.pathname }); } catch (e) { /* cancelado */ } });
  $('#shLink').addEventListener('click', async () => {
    const link = location.origin + location.pathname;
    try { if (navigator.share && !navigator.canShare) throw 0; await navigator.clipboard.writeText(link); toast('Enlace copiado'); }
    catch (e) { try { await navigator.share({ url: link, title: 'Simulador Dinero Despierto' }); } catch (e2) { toast(link); } }
  });
  const f = $('#shNative') || $('#shDown'); if (f) f.focus();
}

// ================= PORTAFOLIO =================
const PRECIOS = {};
Object.keys(D.precios).forEach((t) => { PRECIOS[t] = D.precios[t][1]; });
const precioDe = (h) => h.p != null ? h.p : (PRECIOS[h.t] || h.c);
const valorPortafolio = () => S.holdings.reduce((a, h) => a + h.q * precioDe(h), 0);
const PAL = [GOLD, '#f5f5f5', '#9a9a9a', '#c99a1a', '#6b6b6b', '#e8d9a8'];
function vPortafolio() {
  main.innerHTML = '<div class="stack view">' +
    '<div><h1>Mi portafolio</h1><p class="sub">Registra tus compras y mira cuánto vale hoy lo que tienes. Se guarda solo en este dispositivo.</p></div>' +
    '<div id="pDyn" class="stack"></div>' +
    '<form class="card stack" id="pForm" style="gap:12px" novalidate><div style="font-size:14px;font-weight:800">Agregar compra</div>' +
    '<div class="grid2">' +
    '<div class="field"><label for="f-t">Ticker</label><input class="inp" id="f-t" name="t" type="text" placeholder="VOO" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;font-weight:700" list="tickers"></div>' +
    '<div class="field"><label for="f-q">Cantidad</label><input class="inp" id="f-q" name="q" type="number" inputmode="decimal" min="0" step="any" placeholder="1.5"></div>' +
    '<div class="field"><label for="f-c">Precio de compra</label><input class="inp" id="f-c" name="c" type="number" inputmode="decimal" min="0" step="any" placeholder="150"></div>' +
    '<div class="field"><label for="f-p">Precio actual</label><input class="inp" id="f-p" name="p" type="number" inputmode="decimal" min="0" step="any" placeholder="Opcional"></div>' +
    '</div><datalist id="tickers">' + Object.keys(PRECIOS).map((t) => '<option value="' + t + '">').join('') + '</datalist>' +
    '<div id="fErr" class="t13" style="color:var(--down);font-weight:600" role="alert"></div>' +
    '<button class="btn sm" type="submit">Agregar al portafolio</button>' +
    '<div class="fine" style="font-size:11px">Los tickers del comparador traen su precio de cierre del ' + fechaTxt + ' y se actualizan solos. Para otros, escribe el precio actual; si lo dejas vacío se usa el de compra.</div></form>' +
    '<button type="button" class="btn ghost" data-go="retiro">¿Cuánto tendría al retirarme con esto?</button>' +
    '</div>';
  $('#f-t').addEventListener('input', (e) => { const t = e.target.value.trim().toUpperCase(); $('#f-p').placeholder = PRECIOS[t] ? String(PRECIOS[t]) : 'Opcional'; });
  $('#pForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = $('#f-t').value.trim().toUpperCase(), qn = parseFloat($('#f-q').value), c = parseFloat($('#f-c').value);
    let p = parseFloat($('#f-p').value); if (!(p > 0)) p = null;
    const err = $('#fErr');
    if (!t) { err.textContent = 'Escribe el ticker, por ejemplo VOO.'; $('#f-t').focus(); return; }
    if (!(qn > 0)) { err.textContent = 'La cantidad debe ser mayor que cero.'; $('#f-q').focus(); return; }
    if (!(c > 0)) { err.textContent = 'Escribe el precio al que compraste.'; $('#f-c').focus(); return; }
    err.textContent = '';

    const ex = S.holdings.find((h) => h.t === t);
    if (ex) { const qN = ex.q + qn; ex.c = (ex.q * ex.c + qn * c) / qN; ex.q = Math.round(qN * 10000) / 10000; if (p) ex.p = p; }
    else S.holdings.push({ id: S.nextId++, t, q: qn, c, p });
    guardarPf();
    e.target.reset();
    pintarPortafolio();
    toast(t + ' agregado');
  });
  pintarPortafolio();
}
function pintarPortafolio() {
  const val = valorPortafolio(), costo = S.holdings.reduce((a, h) => a + h.q * h.c, 0), pnl = val - costo;
  const pos = pnl >= 0, ej = S.holdings.some((h) => h.ej);
  const rows = S.holdings.map((h, i) => {
    const v = h.q * precioDe(h), cst = h.q * h.c, pl = v - cst;
    return { h, v, pl, pct: cst > 0 ? pl / cst * 100 : 0, peso: val > 0 ? v / val * 100 : 0, color: PAL[i % PAL.length] };

    (ej ? '<div class="dashed" style="border-color:var(--gold-d);color:var(--txt2)">Esto es un ejemplo. Cuando agregues tu primera compra, se reemplaza por tu portafolio real.</div>' : '') +
    '<div class="card stack" style="gap:14px;padding:20px"><div><div class="lbl">VALOR TOTAL</div><div style="font-size:38px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums">' + money(val, 2) + '</div>' +
    '<div class="t14" style="font-weight:700;margin-top:4px;color:' + (pos ? UP : DOWN) + '">' + (pos ? '+' : '') + money(pnl, 2) + ' (' + (costo > 0 ? (pos ? '+' : '') + (pnl / costo * 100).toFixed(1) : '0.0') + '%) desde que compraste</div></div>' +
    '<div class="alloc">' + rows.map((r) => '<i style="width:' + r.peso.toFixed(1) + '%;background:' + r.color + '"></i>').join('') + '</div>' +
    '<div class="row" style="flex-wrap:wrap;gap:6px 14px">' + rows.map((r) => '<span class="row" style="gap:6px;font-size:12px;color:#d4d4d4"><i class="sw" style="background:' + r.color + '"></i>' + esc(r.h.t) + ' ' + Math.round(r.peso) + '%</span>').join('') + '</div>' +
    '<div class="between" style="font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px"><span>Invertido: <strong style="color:var(--txt2)">' + money(costo, 2) + '</strong></span><span>' + rows.length + ' posiciones</span></div></div>' +
    '<div class="stack" style="gap:10px">' + (rows.length ? rows.map((r) => '<div class="card hold" style="padding:14px"><div class="ic" style="color:' + r.color + '">' + esc(r.h.t) + '</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">' + money(r.v, 2) + '</div><div style="font-size:11px;color:var(--muted);margin-top:2px">' + r.h.q + (r.h.q === 1 ? ' unidad' : ' unidades') + ' · compra ' + money(r.h.c, 2) + '</div></div><div style="text-align:right"><div style="font-size:13px;font-weight:800;color:' + (r.pl >= 0 ? UP : DOWN) + '">' + (r.pl >= 0 ? '+' : '') + r.pct.toFixed(1) + '%</div><div style="font-size:11px;margin-top:2px;color:' + (r.pl >= 0 ? UP : DOWN) + '">' + (r.pl >= 0 ? '+' : '') + money(r.pl, 2) + '</div></div><button type="button" class="x" data-quitar="' + r.h.id + '" aria-label="Quitar ' + esc(r.h.t) + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>').join('') : '<div class="dashed" style="text-align:center">Aún no tienes posiciones. Agrega tu primera compra abajo.</div>') + '</div>';
  $('#pDyn').querySelectorAll('[data-quitar]').forEach((b) => b.addEventListener('click', () => {
    S.holdings = S.holdings.filter((h) => String(h.id) !== b.dataset.quitar); guardarPf(); pintarPortafolio();
  }));
