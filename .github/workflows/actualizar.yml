name: Actualizar precios

on:
  schedule:
    # De lunes a viernes a las 22:30 UTC (5:30 p. m. en Colombia), después del cierre de la bolsa
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python actualizar.py
      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
          else
            git config user.name "actualizador"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "Precios del $(date -u +%Y-%m-%d)"
            git push
          fi
